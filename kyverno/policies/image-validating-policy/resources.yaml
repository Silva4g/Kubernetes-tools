# kubectl apply -f resources.yaml → signed passa (com digest), unsigned é bloqueado
apiVersion: v1
kind: Pod
metadata:
  name: signed
spec:
  containers:
    - name: app
      image: ghcr.io/kyverno/test-verify-image:signed
---
apiVersion: v1
kind: Pod
metadata:
  name: unsigned
spec:
  containers:
    - name: app
      image: ghcr.io/kyverno/test-verify-image:unsigned
