# kubectl apply -f rbac.yaml  (antes da policy, senão o cleanup não tem permissão)
# kubectl apply -f resources.yaml
# kubectl get pods -w → temp-pod some depois de ~2 min, keep-pod fica
apiVersion: v1
kind: Pod
metadata:
  name: temp-pod
  labels:
    lab/temporary: "true"
    lab/ttl: 2m
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Pod
metadata:
  name: keep-pod
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
