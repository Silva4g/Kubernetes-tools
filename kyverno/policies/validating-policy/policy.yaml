# ValidatingPolicy: aceita ou bloqueia o recurso com expressões CEL.
# Equivalente ao "validate" das ClusterPolicy antigas, no formato do
# ValidatingAdmissionPolicy nativo do Kubernetes.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: pod-best-practices
spec:
  # Deny = bloqueia | Audit = só gera report | Warn = devolve warning no kubectl
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
    # Não valida os namespaces do sistema
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kyverno]
  # O autogen já cria a mesma regra para Deployment, StatefulSet, Job, CronJob...
  # (a expressão vira object.spec.template.spec.containers automaticamente)
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, !c.image.endsWith(':latest') && c.image.contains(':'))
      message: Use uma tag fixa na imagem (não use latest nem deixe sem tag).

    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.limits)
        && has(c.resources.limits.memory))
      message: Todo container precisa de resources.limits.memory.

    - expression: >-
        has(object.metadata.labels) && 'app.kubernetes.io/name' in object.metadata.labels
      # messageExpression monta a mensagem dinamicamente com CEL
      messageExpression: >-
        'O pod ' + object.metadata.name + ' precisa da label app.kubernetes.io/name.'
